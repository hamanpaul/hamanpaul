name: Profile Architecture
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require committed canonical artifacts
        run: test -f docs/facts.json && test -f docs/index.json && test -f docs/index.html
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tt-a1i/archify
          ref: a07fa1d5b2a10cbea110c5a2be2817397a301cdc
          path: .archify-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Source, projection, native 9/9, and exact HTML
        run: |
          python scripts/verify_profile_architecture.py --archify-root .archify-engine/archify --receipt /tmp/profile-review/semantic-native.json
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.51.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Original Archify browser evidence
        env:
          ARCHIFY_CHROME: /usr/bin/google-chrome
        run: |
          node .archify-engine/archify/bin/archify.mjs visual-check docs/index.html --json > /tmp/profile-review/native-visual.json
      - name: Real file navigation and semantic interactions
        run: python scripts/check_profile_browser.py --output /tmp/profile-review/browser
      - name: Preserve reviewed bytes and receipts
        if: always()
        run: |
          mkdir -p /tmp/profile-review/deliverables
          cp docs/index.html docs/index.json docs/facts.json docs/toolchain.json /tmp/profile-review/deliverables/
          cp docs/index.visual-check* /tmp/profile-review/ 2>/dev/null || true
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: profile-architecture-review
          path: /tmp/profile-review
          retention-days: 14
