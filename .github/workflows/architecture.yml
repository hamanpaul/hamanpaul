name: Architecture documentation

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - .github/workflows/architecture.yml
  push:
    branches: [main, docs/profile-architecture]
    paths:
      - README.md
      - docs/**
      - .github/workflows/architecture.yml

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARCHIFY_UPDATE_CHECK_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public-source provenance and semantic projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p architecture-evidence
          python3 docs/build_architecture.py snapshot --sources-root "$RUNNER_TEMP/profile-sources"
          git diff --exit-code -- docs/evidence docs/source-manifest.json
          python3 docs/build_architecture.py provenance --sources-root "$RUNNER_TEMP/profile-sources" | tee architecture-evidence/provenance.json
          python3 docs/build_architecture.py verify | tee architecture-evidence/facts.json
          python3 -m unittest discover -s docs -p test_architecture.py -v 2>&1 | tee architecture-evidence/tests.txt
      - name: Exact re-render with pinned native Archify engine
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/profile-archify"
          git -C "$RUNNER_TEMP/profile-archify" fetch --quiet --depth=1 https://github.com/tt-a1i/archify.git d673e8300df60a5c8166abe78787fdc78f6b8000
          git -C "$RUNNER_TEMP/profile-archify" checkout --quiet FETCH_HEAD
          python3 docs/build_architecture.py check-html --archify-root "$RUNNER_TEMP/profile-archify/archify" | tee architecture-evidence/native-delivery.json
          git diff --exit-code -- README.md docs/facts.json docs/architecture.json docs/index.html
      - name: Install Chinese fonts for truthful visual evidence
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-match ':lang=zh-tw' | tee architecture-evidence/cjk-font.txt
      - name: Real file navigation and desktop browser evidence
        shell: bash
        run: |
          set -euo pipefail
          export ARCHIFY_CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$ARCHIFY_CHROME" --version | tee architecture-evidence/browser-version.txt
          node "$RUNNER_TEMP/profile-archify/archify/bin/archify.mjs" visual-check docs/index.html --json | tee architecture-evidence/browser.json
          cp docs/index.visual-check* architecture-evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-evidence-${{ github.run_id }}
          path: architecture-evidence/
          retention-days: 14
